name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /add in the assignments channel
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of /about, or the image tag you run.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: How you run it
      options:
        - Docker image from Docker Hub
        - Docker Compose, built from source
        - npm start
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The matching lines from log/. Remove tokens, IDs and calendar URLs first.
      render: text
