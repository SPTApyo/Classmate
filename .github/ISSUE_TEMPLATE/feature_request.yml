name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How the bot could help. Mockups of messages or commands welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other bots or workarounds you know of.
